name: Set up pebble
description: >
  Install the pebble coverage tracer for the PHP on this runner, the pebble
  reporter binary, and the PHPUnit glue. Works with setup-php (use
  coverage: none) on GitHub-hosted and self-hosted Linux and macOS runners.
  On a pebble runner image, where the tracer is preinstalled, it downloads
  nothing and only writes the job's settings.
author: pebble

inputs:
  directory:
    description: Comma-separated directories and files to cover, relative to the workspace (or absolute), e.g. "app,routes,helpers.php". Default is what the PHPUnit configuration lists in <source> (PHPUnit 10+), <coverage> (9.3+) or <filter><whitelist>.
    required: false
    default: ''
  exclude:
    description: Comma-separated paths to exclude, relative to the workspace. Default is the configuration's exclude list.
    required: false
    default: ''
  configuration:
    description: "PHPUnit configuration to read the lists from (default: phpunit.xml, phpunit.xml.dist or phpunit.dist.xml in the workspace)."
    required: false
    default: ''
  output:
    description: Directory for coverage streams, exported as PEBBLE_OUTPUT.
    required: false
    default: .pebble/runs
  version:
    description: pebble release tag to install, or "latest".
    required: false
    default: latest
  repository:
    description: GitHub repository that publishes the releases. The default is public, so no token is needed.
    required: false
    default: getOtterWise/pebble-setup
  token:
    description: >
      Token that can read releases of the repository above. Only needed when
      that repository is private (fine-grained PAT with Contents: read).
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The installed release tag.
    value: ${{ steps.install.outputs.version }}
  extension:
    description: Path of the installed pebble.so.
    value: ${{ steps.install.outputs.extension }}
  binary:
    description: Path of the pebble binary.
    value: ${{ steps.install.outputs.binary }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repository }}
        VERSION: ${{ inputs.version }}
        IN_DIRECTORY: ${{ inputs.directory }}
        IN_EXCLUDE: ${{ inputs.exclude }}
        IN_CONFIGURATION: ${{ inputs.configuration }}
        IN_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        command -v php >/dev/null || { echo "::error::php is not on PATH; run setup-php (with coverage: none) before this action"; exit 1; }

        # ---- identify the PHP ABI -------------------------------------------------
        BUILD=$(php -i | sed -n 's/^PHP Extension Build => //p')       # e.g. API20210902,NTS
        API=$(echo "$BUILD" | sed -n 's/^API\([0-9]*\),.*/\1/p')
        TS=$(echo "$BUILD" | grep -q ZTS && echo zts || echo nts)
        DEBUG=$(echo "$BUILD" | grep -qi debug && echo 1 || echo 0)
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')                      # linux | darwin
        ARCH=$(uname -m); case "$ARCH" in x86_64|amd64) ARCH=x86_64;; aarch64|arm64) ARCH=arm64;; esac
        PHP_VERSION=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
        EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
        SCAN_DIR=$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')
        echo "PHP $PHP_VERSION, $BUILD, $OS/$ARCH, extension_dir=$EXT_DIR, scan_dir=$SCAN_DIR"
        [ -n "$SCAN_DIR" ] || { echo "::error::this PHP has no ini scan directory; cannot enable the extension"; exit 1; }
        SUDO=""; [ -w "$SCAN_DIR" ] || SUDO="sudo"

        # ---- job settings ---------------------------------------------------------
        abs() { case "$1" in /*) echo "$1";; *) echo "$GITHUB_WORKSPACE/$1";; esac; }
        list() { local out="" p; IFS=',' read -ra parts <<< "$1"; for p in "${parts[@]}"; do p=$(echo "$p" | xargs); [ -n "$p" ] && out="${out:+$out,}$(abs "$p")"; done; echo "$out"; }
        DIRECTORY=$(list "$IN_DIRECTORY")
        EXCLUDE=$(list "$IN_EXCLUDE")
        # What the inputs leave empty comes from the PHPUnit configuration, as php-code-coverage reads it. Needs the glue, so it runs once GLUE is known.
        job_settings() {
          if [ -z "$IN_DIRECTORY" ] || [ -z "$IN_EXCLUDE" ]; then
            local detected script="$(dirname "$GLUE")/src/detect-source.php"
            if [ ! -f "$script" ]; then
              # A release before 0.1.13 has no detector: the directory input must carry the list, and the excludes are what the input says.
              [ -n "$IN_DIRECTORY" ] || { echo "::error::this pebble release cannot read the PHPUnit configuration ($script is missing); pass the directory input or use version 0.1.13 or later"; exit 1; }
              return
            fi
            detected=$(cd "$GITHUB_WORKSPACE" && php "$script" ${IN_CONFIGURATION:+"$IN_CONFIGURATION"}) || detected=""
            [ -n "$IN_DIRECTORY" ] || DIRECTORY=$(echo "$detected" | sed -n 's/^directory=//p')
            [ -n "$IN_EXCLUDE" ] || EXCLUDE=$(echo "$detected" | sed -n 's/^exclude=//p')
            [ "$(echo "$detected" | sed -n 's/^discover=//p')" != 0 ] || echo "PEBBLE_DISCOVER=0" >> "$GITHUB_ENV"
            [ -n "$DIRECTORY" ] || { echo "::error::no directory input, and the PHPUnit configuration lists no source to cover (<source>, <coverage> or <filter><whitelist>)"; exit 1; }
            echo "from the PHPUnit configuration: directory=$DIRECTORY exclude=$EXCLUDE"
          fi
        }
        PCOV_OFF=$(php -m | grep -ix pcov >/dev/null && echo "pcov.enabled=0" || true)

        if php -m | grep -ix pebble >/dev/null && command -v pebble >/dev/null; then
        # ---- preinstalled (pebble runner image): nothing to download ---------------
        VERSION="v$(php -r 'echo phpversion("pebble");')"
        BIN=$(command -v pebble)
        # The image exports PEBBLE_GLUE, a VM built from it keeps only the fixed
        # layout (docker export drops the environment), and an image older than
        # the one that stopped prepending the glue everywhere keeps the ini value.
        GLUE="${PEBBLE_GLUE:-}"
        [ -n "$GLUE" ] || [ ! -f /opt/pebble/php/autoload.php ] || GLUE=/opt/pebble/php/autoload.php
        [ -n "$GLUE" ] || GLUE=$(php -r 'echo ini_get("auto_prepend_file");')
        [ -f "$GLUE" ] || { echo "::error::the glue autoloader is not on this runner (PEBBLE_GLUE is empty and /opt/pebble/php/autoload.php is missing)"; exit 1; }
        echo "pebble $VERSION is preinstalled on this runner ($BIN); writing the job settings only"
        job_settings
        # "zz-" sorts after the image's "99-pebble.ini" and after setup-php's "99-pecl.ini" (its ini-values); the image ini must not set pebble.directory
        # The image prepends nothing, so a job without this action gets a plain PHP; the prepend here is what a project that lists the extension in phpunit.xml and takes the glue from the runner needs. `pebble run` does not read it.
        printf 'pebble.directory=%s\npebble.exclude=%s\nauto_prepend_file=%s\nopcache.enable_cli=0\n%s\n' "$DIRECTORY" "$EXCLUDE" "$GLUE" "$PCOV_OFF" > "${RUNNER_TEMP:-/tmp}/pebble-job.ini"
        $SUDO cp "${RUNNER_TEMP:-/tmp}/pebble-job.ini" "$SCAN_DIR/zz-pebble.job.ini"
        else

        # ---- resolve the release --------------------------------------------------
        if ! gh api "repos/$REPO" >/dev/null 2>&1; then
          echo "::error::the token cannot read $REPO; pass a fine-grained PAT with Contents: read on that repository as the 'token' input"
          exit 1
        fi
        if [ "$VERSION" = latest ]; then
          VERSION=$(gh release view --repo "$REPO" --json tagName -q .tagName)
        fi
        TOOL="${RUNNER_TOOL_CACHE:-$HOME/.cache}/pebble/$VERSION/$API-$TS-$OS-$ARCH"
        mkdir -p "$TOOL/bin" "$TOOL/glue"
        echo "installing pebble $VERSION into $TOOL"

        # ---- download assets ------------------------------------------------------
        SO_ASSET="pebble-php${API}-${TS}-${OS}-${ARCH}.so"
        BIN_ASSET="pebble-${OS}-${ARCH}"
        cd "$TOOL"
        gh release download "$VERSION" --repo "$REPO" --clobber \
          --pattern SHA256SUMS --pattern pebble-glue.tar.gz --pattern pebble-ext-src.tar.gz \
          --pattern "$BIN_ASSET" --pattern "$SO_ASSET" || true

        verify() { grep " $1\$" SHA256SUMS | (command -v sha256sum >/dev/null && sha256sum -c - || shasum -a 256 -c -) >/dev/null; }
        for f in pebble-glue.tar.gz "$BIN_ASSET"; do
          [ -f "$f" ] || { echo "::error::release $VERSION has no asset $f"; exit 1; }
          verify "$f"
        done

        if [ -f "$SO_ASSET" ] && [ "$DEBUG" = 0 ]; then
          verify "$SO_ASSET"
          cp "$SO_ASSET" pebble.so
          echo "using prebuilt $SO_ASSET"
        else
          echo "no prebuilt extension for $BUILD on $OS/$ARCH; building from source"
          # The public releases ship no extension source; only the private source repository does.
          [ -f pebble-ext-src.tar.gz ] || { echo "::error::release $VERSION of $REPO has no prebuilt extension $SO_ASSET and no source tarball; use a PHP build with a prebuilt asset, or set repository to getOtterWise/pebble with a token that can read it"; exit 1; }
          verify pebble-ext-src.tar.gz
          command -v phpize >/dev/null || { echo "::error::phpize not found; install the PHP development headers"; exit 1; }
          rm -rf ext-src && mkdir ext-src && tar xzf pebble-ext-src.tar.gz -C ext-src
          ( cd ext-src && phpize >/dev/null && ./configure --enable-pebble >/dev/null && make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)" >/dev/null )
          cp ext-src/modules/pebble.so pebble.so
        fi

        tar xzf pebble-glue.tar.gz -C glue
        cp "$BIN_ASSET" bin/pebble && chmod +x bin/pebble

        # ---- install --------------------------------------------------------------
        [ -w "$EXT_DIR" ] || SUDO="sudo"
        $SUDO cp pebble.so "$EXT_DIR/pebble.so"
        BIN="$TOOL/bin/pebble"
        GLUE="$TOOL/glue/autoload.php"
        job_settings
        {
          echo "extension=pebble.so"
          echo "pebble.directory=$DIRECTORY"
          echo "pebble.exclude=$EXCLUDE"
          echo "auto_prepend_file=$GLUE"
          echo "opcache.enable_cli=0"
          echo "$PCOV_OFF"
        } > pebble.ini
        $SUDO mkdir -p "$SCAN_DIR"
        # "zz-" sorts after setup-php's "99-pecl.ini", where its ini-values land, so opcache.enable_cli=0 wins.
        $SUDO cp pebble.ini "$SCAN_DIR/zz-pebble.ini"
        echo "$TOOL/bin" >> "$GITHUB_PATH"
        fi

        echo "PEBBLE_OUTPUT=$(abs "$IN_OUTPUT")" >> "$GITHUB_ENV"
        echo "PEBBLE_GLUE=$GLUE" >> "$GITHUB_ENV"

        # ---- verify ---------------------------------------------------------------
        php -m | grep -ix pebble >/dev/null || { echo "::error::pebble did not load; php -m output follows"; php -m; exit 1; }
        # opcache in the coverage process makes the extension disable itself, and the run records no files.
        if [ "$(php -r 'echo (int) ini_get("opcache.enable_cli");')" = 1 ]; then
          echo "::error::opcache.enable_cli is on, so pebble cannot instrument; something sets it after $SCAN_DIR/zz-pebble.ini (php --ini follows). Remove it for coverage runs, and never pass -d opcache.enable_cli=1 to the test command."
          php --ini; exit 1
        fi
        php -m | grep -ix xdebug >/dev/null && echo "::warning::xdebug is loaded; disable it for coverage runs"
        echo "pebble extension $(php -r 'echo phpversion("pebble");') loaded, directory $DIRECTORY"
        "$BIN" --version

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "extension=$EXT_DIR/pebble.so" >> "$GITHUB_OUTPUT"
        echo "binary=$BIN" >> "$GITHUB_OUTPUT"
